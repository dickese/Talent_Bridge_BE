server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v1}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/database}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
#  mail:
#    host: ${MAIL_HOST:smtp.gmail.com}
#    port: ${MAIL_PORT:587}
#    username: ${MAIL_USERNAME:your_email@gmail.com}
#    password: ${MAIL_PASSWORD:your_app_password}
#    properties:
#      mail:
#        smtp:
#          auth: ${MAIL_SMTP_AUTH:true}
#          starttls:
#            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  cache:
    type: redis

  data:
    web:
      pageable:
        one-indexed-parameters: true

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_minimum_256_bits_length_for_security}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:300}
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}

email:
  task:
    max-retry: ${EMAIL_TASK_MAX_RETRY:2}
  worker:
    pool-size: ${EMAIL_WORKER_POOL_SIZE:5}
    poll-limit: ${EMAIL_WORKER_POLL_LIMIT:10}
    poll-interval-ms: ${EMAIL_WORKER_POLL_INTERVAL_MS:5000}
    max-idle-ms: ${EMAIL_WORKER_MAX_IDLE_MS:60000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example.demo.scheduler: ${EMAIL_SCHEDULER_LOG_LEVEL:DEBUG}
    com.example.demo.scheduler.worker: ${EMAIL_WORKER_LOG_LEVEL:DEBUG}
    com.example.demo.service.impl.EmailTaskServiceImpl: ${EMAIL_TASK_SERVICE_LOG_LEVEL:DEBUG}
    com.example.demo.service.impl.EmailServiceImpl: ${EMAIL_SERVICE_LOG_LEVEL:DEBUG}
    com.example.demo.service.impl.JobServiceImpl: ${EMAIL_JOB_SERVICE_LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_FILE_PATH:logs/application.log}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

